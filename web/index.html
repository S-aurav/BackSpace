<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BackSpace — Real-Time Chat & Group Messaging App">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS PWA Meta Tags & Fullscreen Capability -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BackSpace">
  <meta name="theme-color" content="#007AFF">

  <!-- Apple Touch Icons for iOS Home Screen -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BackSpace</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      height: 100vh;
      width: 100vw;
    }
    #pwa-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 45%, #16161C 0%, #000000 85%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    .splash-logo-circle {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 45px rgba(0, 122, 255, 0.42), 0 0 0 3px rgba(255, 255, 255, 0.25);
      animation: pulse 2.2s infinite ease-in-out;
    }
    .splash-logo-circle img {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: contain;
      display: block;
    }
    .splash-brand {
      margin-top: 24px;
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.6px;
      opacity: 0.95;
    }
    .splash-brand span {
      color: #007AFF;
    }
    @keyframes pulse {
      0% { transform: scale(0.97); opacity: 0.88; }
      50% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(0.97); opacity: 0.88; }
    }
  </style>
</head>
<body>
  <!-- Native-feeling dark splash for iOS home screen launch -->
  <div id="pwa-splash">
    <div class="splash-logo-circle">
      <img src="favicon.png" alt="BackSpace">
    </div>
    <div class="splash-brand">Back<span>Space</span></div>
  </div>

  <script>
    // Ensure mobile browsers (Chrome Android / iOS WebKit) play scanner video inline and muted
    (function() {
      try {
        var origPlay = HTMLMediaElement.prototype.play;
        HTMLMediaElement.prototype.play = function() {
          this.playsInline = true;
          this.setAttribute('playsinline', '');
          this.setAttribute('webkit-playsinline', '');
          this.muted = true;
          this.autoplay = true;
          return origPlay.apply(this, arguments);
        };
      } catch (e) {
        console.warn('Media element patch failed:', e);
      }
    })();

    // Auto-purge stale PWA caches from older versions on Android/iOS/Desktop
    (function() {
      var CURRENT_BUILD = 'v2.3.0-notifications-v1';
      try {
        if (window.localStorage && localStorage.getItem('pwa_build_version') !== CURRENT_BUILD) {
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(reg) { reg.unregister(); });
            });
          }
          localStorage.setItem('pwa_build_version', CURRENT_BUILD);
        }
      } catch (e) {
        console.warn('Cache purge check failed:', e);
      }
    })();

    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('pwa-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() { splash.remove(); }, 400);
      }
    });

    // Register Firebase Messaging Service Worker for background notifications
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js')
        .then(function(reg) {
          console.log('[FCM SW] Registered successfully:', reg.scope);
        }).catch(function(err) {
          console.log('[FCM SW] Registration failed:', err);
        });
    }

    // Helper to detect iOS devices (iPhone, iPad, iPod)
    window.isIOSDevice = function() {
      var ua = window.navigator.userAgent || '';
      return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    };

    // Helper to detect if running in Standalone PWA mode
    window.isPWAStandalone = function() {
      return (window.navigator.standalone === true) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    };

    // Get current notification authorization status
    window.getWebNotificationStatus = function() {
      var isIOS = window.isIOSDevice();
      var isStandalone = window.isPWAStandalone();

      if (!("Notification" in window)) {
        if (isIOS && !isStandalone) {
          return 'ios_safari_needs_pwa';
        }
        return 'unsupported';
      }

      if (Notification.permission === 'granted') {
        return 'granted';
      } else if (Notification.permission === 'denied') {
        return 'denied';
      } else {
        if (isIOS && !isStandalone) {
          return 'ios_safari_needs_pwa';
        }
        return 'prompt';
      }
    };

    // Request notification permission via explicit user gesture
    window.requestWebNotificationPermission = function(callback) {
      var isIOS = window.isIOSDevice();
      var isStandalone = window.isPWAStandalone();

      if (!("Notification" in window)) {
        if (isIOS && !isStandalone) {
          if (callback) callback('ios_safari_needs_pwa');
          return;
        }
        if (callback) callback('unsupported');
        return;
      }

      try {
        var res = Notification.requestPermission();
        if (res && typeof res.then === 'function') {
          res.then(function(permission) {
            if (callback) callback(permission);
          }).catch(function() {
            if (callback) callback('denied');
          });
        } else if (callback) {
          callback(Notification.permission);
        }
      } catch (err) {
        console.warn('requestPermission error:', err);
        if (callback) callback('denied');
      }
    };

    // Native browser notification dispatcher
    window.showWebNotification = function(title, body, tag, icon) {
      if (!("Notification" in window)) return;
      var options = {
        body: body || '',
        icon: icon || '/favicon.png',
        badge: '/favicon.png',
        tag: tag || 'backspace-notification',
        renotify: true
      };

      function triggerNotification() {
        try {
          var n = new Notification(title, options);
          n.onclick = function() {
            window.focus();
            this.close();
          };
        } catch (e) {
          if (navigator.serviceWorker && navigator.serviceWorker.ready) {
            navigator.serviceWorker.ready.then(function(reg) {
              reg.showNotification(title, options);
            });
          }
        }
      }

      if (Notification.permission === "granted") {
        triggerNotification();
      } else if (Notification.permission !== "denied") {
        Notification.requestPermission().then(function(permission) {
          if (permission === "granted") {
            triggerNotification();
          }
        });
      }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
